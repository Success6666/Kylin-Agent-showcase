<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="550" viewBox="0 0 1500 550" role="img" aria-labelledby="title desc">
<title id="title">Kylin Agent 执行校验与审批</title><desc id="desc">请求身份、工具发现、Harness校验、治理与证据记录。</desc>
